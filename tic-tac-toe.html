<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic Tac Toe | CG Creations</title><link rel="stylesheet" href="/styles.css?v=20260720a"></head>
<body data-game-key="tic-tac-toe" data-game-label="Tic Tac Toe" data-board-game="tic"><main class="app"><section class="panel game-suite-panel"><a class="back-link" href="/apps">Back to Apps</a><p class="eyebrow">Three-level strategy</p><h1>Tic Tac Toe</h1><p class="intro">You are X. Make three in a row before the computer does.</p>
<div class="game-toolbar"><div><span class="spoken-label">Difficulty</span><div class="difficulty-picker" role="group" aria-label="Difficulty"><button class="secondary" data-level="easy">Easy</button><button class="secondary is-selected" data-level="medium">Medium</button><button class="secondary" data-level="hard">Hard</button></div></div><div class="actions"><button data-new-game type="button">New Game</button><button class="secondary" data-track-score="true" type="button">Track your score</button></div></div>
<div class="game-layout"><div class="game-board-shell"><div id="tic-board" class="tic-board" aria-label="Tic Tac Toe board"></div></div><aside class="game-side-card"><p id="game-message" class="game-message" aria-live="polite">Your turn. Choose a square.</p><div class="mini-stats"><div class="mini-stat"><span>Wins</span><strong id="wins">0</strong></div><div class="mini-stat"><span>Draws</span><strong id="draws">0</strong></div><div class="mini-stat"><span>Losses</span><strong id="losses">0</strong></div></div><section class="info"><h2>How it thinks</h2><p class="support-text">Easy plays randomly. Medium looks for wins and blocks. Hard searches every possible ending.</p></section></aside></div></section></main>
