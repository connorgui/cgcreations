<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic Tac Toe | CG Creations</title><link rel="stylesheet" href="/apps-theme.css?v=20260810a"></head>
<body data-game-key="tic-tac-toe" data-game-label="Tic Tac Toe" data-board-game="tic"><main class="app"><section class="panel game-suite-panel"><a class="back-link" href="/apps">Back to Apps</a><p class="eyebrow">Three-level strategy</p><h1>Tic Tac Toe</h1><p id="game-intro" class="intro">You are X. Make three in a row before the computer does.</p>
<div class="game-toolbar"><div class="game-option-groups"><div><span class="spoken-label">Opponent</span><div class="difficulty-picker mode-picker" role="group" aria-label="Opponent"><button class="secondary is-selected" data-mode="ai" aria-pressed="true">Computer</button><button class="secondary" data-mode="local" aria-pressed="false">2 Players</button></div></div><div data-difficulty><span class="spoken-label">Difficulty</span><div class="difficulty-picker" role="group" aria-label="Difficulty"><button class="secondary" data-level="easy">Easy</button><button class="secondary is-selected" data-level="medium">Medium</button><button class="secondary" data-level="hard">Hard</button></div></div></div><div class="actions game-history-actions"><button data-new-game type="button">Reset Board</button><button class="secondary" data-undo type="button" disabled>Undo</button><button class="secondary" data-redo type="button" disabled>Redo</button><button class="secondary" data-track-score="true" type="button">Track your score</button></div></div>
